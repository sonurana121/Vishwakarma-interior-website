<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Login & Signup</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Neon Circle -->
    <div class="circle">

        <div class="form-box">

            <!-- LOGIN -->
            <div class="form login-form active">

                <h1>WELCOME</h1>
                <p class="subtitle">Login to your account</p>

                <form id="loginForm">

                    <div class="input-box">
                        <input type="email" id="loginEmail"
                               placeholder="Email Address"
                               required>
                    </div>

                    <div class="input-box">
                        <input type="password"
                               id="loginPassword"
                               placeholder="Password"
                               required>

                        <span class="eye"
                              onclick="togglePassword('loginPassword', this)">
                            👁
                        </span>
                    </div>

                    <div class="options">

                        <label>
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>

                        <a href="#" onclick="forgotPassword(event)">
                            Forgot?
                        </a>

                    </div>

                    <button type="submit" class="btn">
                        LOGIN
                    </button>

                </form>

                <p class="switch-text">
                    Don't have an account?
                    <a href="#" onclick="showSignup(event)">
                        Sign Up
                    </a>
                </p>

            </div>


            <!-- SIGN UP -->
            <div class="form signup-form">

                <h1>SIGN UP</h1>
                <p class="subtitle">Create your account</p>

                <form id="signupForm">

                    <div class="input-box">
                        <input type="text"
                               id="name"
                               placeholder="Full Name"
                               required>
                    </div>

                    <div class="input-box">
                        <input type="email"
                               id="signupEmail"
                               placeholder="Email Address"
                               required>
                    </div>

                    <div class="input-box">
                        <input type="password"
                               id="signupPassword"
                               placeholder="Password"
                               required>

                        <span class="eye"
                              onclick="togglePassword('signupPassword', this)">
                            👁
                        </span>
                    </div>

                    <button type="submit" class="btn">
                        CREATE ACCOUNT
                    </button>

                </form>

                <p class="switch-text">
                    Already have an account?
                    <a href="#" onclick="showLogin(event)">
                        Log In
                    </a>
                </p>

            </div>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
